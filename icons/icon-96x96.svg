<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="grad96" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="96" height="96" fill="url(#grad96)" rx="18"/>
  
  <!-- Gamepad Controller -->
  <g>
    <!-- Main body -->
    <rect x="13" y="28" width="70" height="40" rx="8" fill="#0a0e27" opacity="0.9"/>
    
    <!-- Left D-Pad -->
    <g transform="translate(28, 48)">
      <circle cx="0" cy="0" r="8" fill="#00e5ff"/>
      <rect x="-1.5" y="-6" width="3" height="12" fill="#0a0e27"/>
      <rect x="-6" y="-1.5" width="12" height="3" fill="#0a0e27"/>
    </g>
    
    <!-- Right Buttons -->
    <g transform="translate(68, 48)">
      <circle cx="4" cy="4" r="3" fill="#ff4500"/>
      <circle cx="10" cy="0" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="-4" r="3" fill="#3b82f6"/>
      <circle cx="4" cy="-8" r="3" fill="#10b981"/>
    </g>
    
    <!-- Center button -->
    <ellipse cx="48" cy="48" rx="6" ry="4" fill="#00d9ff" opacity="0.6"/>
  </g>
</svg>