<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow192">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad192)" rx="40"/>
  
  <!-- Gamepad Controller Shape -->
  <g filter="url(#shadow192)">
    <!-- Main body -->
    <rect x="30" y="60" width="132" height="72" rx="16" fill="#0a0e27" opacity="0.9"/>
    
    <!-- Left D-Pad -->
    <g transform="translate(55, 86)">
      <!-- D-Pad background -->
      <circle cx="0" cy="0" r="16" fill="#00e5ff"/>
      <!-- Vertical bar -->
      <rect x="-3" y="-12" width="6" height="24" fill="#0a0e27"/>
      <!-- Horizontal bar -->
      <rect x="-12" y="-3" width="24" height="6" fill="#0a0e27"/>
    </g>
    
    <!-- Right Buttons -->
    <g transform="translate(137, 86)">
      <!-- Button A (red) -->
      <circle cx="8" cy="8" r="6" fill="#ff4500"/>
      <!-- Button B (yellow) -->
      <circle cx="20" cy="0" r="6" fill="#f59e0b"/>
      <!-- Button X (blue) -->
      <circle cx="0" cy="-8" r="6" fill="#3b82f6"/>
      <!-- Button Y (green) -->
      <circle cx="8" cy="-16" r="6" fill="#10b981"/>
    </g>
    
    <!-- Center button area -->
    <ellipse cx="96" cy="86" rx="12" ry="8" fill="#00d9ff" opacity="0.6"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="25" r="8" fill="#00d9ff" opacity="0.3"/>
  <circle cx="167" cy="167" r="8" fill="#7c3aed" opacity="0.3"/>
  <circle cx="167" cy="25" r="6" fill="#f59e0b" opacity="0.2"/>
</svg>