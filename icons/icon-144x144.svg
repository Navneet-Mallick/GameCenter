<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="grad144" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow144">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" fill="url(#grad144)" rx="28"/>
  
  <!-- Gamepad Controller Shape -->
  <g filter="url(#shadow144)">
    <!-- Main body -->
    <rect x="20" y="42" width="104" height="60" rx="12" fill="#0a0e27" opacity="0.9"/>
    
    <!-- Left D-Pad -->
    <g transform="translate(42, 72)">
      <circle cx="0" cy="0" r="12" fill="#00e5ff"/>
      <rect x="-2" y="-9" width="4" height="18" fill="#0a0e27"/>
      <rect x="-9" y="-2" width="18" height="4" fill="#0a0e27"/>
    </g>
    
    <!-- Right Buttons -->
    <g transform="translate(102, 72)">
      <circle cx="6" cy="6" r="4.5" fill="#ff4500"/>
      <circle cx="15" cy="0" r="4.5" fill="#f59e0b"/>
      <circle cx="0" cy="-6" r="4.5" fill="#3b82f6"/>
      <circle cx="6" cy="-12" r="4.5" fill="#10b981"/>
    </g>
    
    <!-- Center button -->
    <ellipse cx="72" cy="72" rx="9" ry="6" fill="#00d9ff" opacity="0.6"/>
  </g>
  
  <!-- Decorative corners -->
  <circle cx="18" cy="18" r="6" fill="#00d9ff" opacity="0.3"/>
  <circle cx="126" cy="126" r="6" fill="#7c3aed" opacity="0.3"/>
</svg>