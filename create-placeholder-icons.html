<!DOCTYPE html>
<html>
<head>
  <title>Create Placeholder Icons</title>
</head>
<body>
  <h1>Creating placeholder icons...</h1>
  <div id="status"></div>
  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    
    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#00e5ff');
      gradient.addColorStop(1, '#7c3aed');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Game controller
      ctx.fillStyle = '#0a0e27';
      const centerX = size / 2;
      const centerY = size / 2;
      const width = size * 0.7;
      const height = size * 0.5;
      const radius = size * 0.1;
      
      // Body
      ctx.beginPath();
      ctx.roundRect(centerX - width/2, centerY - height/2, width, height, radius);
      ctx.fill();
      
      // D-pad
      const dpadSize = size * 0.12;
      const dpadX = centerX - width * 0.25;
      const dpadY = centerY;
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(dpadX - dpadSize * 1.5, dpadY - dpadSize * 0.4, dpadSize * 3, dpadSize * 0.8);
      ctx.fillRect(dpadX - dpadSize * 0.4, dpadY - dpadSize * 1.5, dpadSize * 0.8, dpadSize * 3);
      
      // Buttons
      const buttonRadius = size * 0.06;
      const buttonX = centerX + width * 0.25;
      const buttonY = centerY;
      const buttonSpacing = size * 0.12;
      
      const colors = ['#f59e0b', '#ef4444', '#22c55e', '#3b82f6'];
      const positions = [
        [buttonX, buttonY - buttonSpacing],
        [buttonX + buttonSpacing, buttonY],
        [buttonX, buttonY + buttonSpacing],
        [buttonX - buttonSpacing, buttonY]
      ];
      
      positions.forEach((pos, i) => {
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.arc(pos[0], pos[1], buttonRadius, 0, Math.PI * 2);
        ctx.fill();
      });
      
      return canvas;
    }
    
    async function downloadIcon(canvas, size) {
      return new Promise((resolve) => {
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon-${size}x${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
          setTimeout(resolve, 100);
        });
      });
    }
    
    async function createAll() {
      const status = document.getElementById('status');
      status.innerHTML = '<p>Generating icons...</p>';
      
      for (const size of sizes) {
        const canvas = createIcon(size);
        await downloadIcon(canvas, size);
        status.innerHTML += `<p>✓ Created icon-${size}x${size}.png</p>`;
      }
      
      status.innerHTML += '<p style="color:green;font-weight:bold;">✓ All icons created! Move them to the /icons/ folder.</p>';
    }
    
    createAll();
  </script>
</body>
</html>
