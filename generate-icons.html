<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate PWA Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #0a0e27;
      color: #fff;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #00e5ff;
    }
    button {
      background: #00e5ff;
      color: #0a0e27;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #00b8cc;
    }
    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .icon-item {
      text-align: center;
      padding: 15px;
      background: #141a33;
      border-radius: 8px;
      border: 2px solid #00e5ff;
    }
    .icon-item canvas {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .icon-item p {
      margin: 10px 0 0 0;
      color: #00e5ff;
      font-weight: bold;
    }
    #status {
      margin: 20px 0;
      padding: 15px;
      background: #141a33;
      border-radius: 8px;
      border-left: 4px solid #00e5ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 GameCenter PWA Icon Generator</h1>
    <p>Click the button below to generate all required PWA icons.</p>
    
    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAllIcons()">Download All Icons</button>
    
    <div id="status"></div>
    
    <div class="icons-grid" id="icons-grid"></div>
  </div>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    const canvases = {};

    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#00e5ff');
      gradient.addColorStop(1, '#7c3aed');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Game controller icon
      ctx.fillStyle = '#0a0e27';
      ctx.strokeStyle = '#0a0e27';
      ctx.lineWidth = size * 0.02;

      // Controller body
      const centerX = size / 2;
      const centerY = size / 2;
      const width = size * 0.7;
      const height = size * 0.5;
      const radius = size * 0.1;

      ctx.beginPath();
      ctx.roundRect(centerX - width/2, centerY - height/2, width, height, radius);
      ctx.fill();

      // D-pad (left side)
      const dpadSize = size * 0.12;
      const dpadX = centerX - width * 0.25;
      const dpadY = centerY;
      
      ctx.fillStyle = '#00e5ff';
      // Horizontal bar
      ctx.fillRect(dpadX - dpadSize * 1.5, dpadY - dpadSize * 0.4, dpadSize * 3, dpadSize * 0.8);
      // Vertical bar
      ctx.fillRect(dpadX - dpadSize * 0.4, dpadY - dpadSize * 1.5, dpadSize * 0.8, dpadSize * 3);

      // Buttons (right side)
      const buttonRadius = size * 0.06;
      const buttonX = centerX + width * 0.25;
      const buttonY = centerY;
      const buttonSpacing = size * 0.12;

      ctx.fillStyle = '#f59e0b';
      // Top button
      ctx.beginPath();
      ctx.arc(buttonX, buttonY - buttonSpacing, buttonRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      // Right button
      ctx.beginPath();
      ctx.arc(buttonX + buttonSpacing, buttonY, buttonRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#22c55e';
      // Bottom button
      ctx.beginPath();
      ctx.arc(buttonX, buttonY + buttonSpacing, buttonRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3b82f6';
      // Left button
      ctx.beginPath();
      ctx.arc(buttonX - buttonSpacing, buttonY, buttonRadius, 0, Math.PI * 2);
      ctx.fill();

      return canvas;
    }

    function generateAllIcons() {
      const grid = document.getElementById('icons-grid');
      const status = document.getElementById('status');
      grid.innerHTML = '';
      status.innerHTML = '<p>Generating icons...</p>';

      sizes.forEach(size => {
        const canvas = createIcon(size);
        canvases[size] = canvas;

        const item = document.createElement('div');
        item.className = 'icon-item';
        item.innerHTML = `
          ${canvas.outerHTML}
          <p>${size}x${size}</p>
        `;
        grid.appendChild(item);
      });

      status.innerHTML = '<p style="color:#22c55e;">✓ All icons generated! Click "Download All Icons" to save them.</p>';
    }

    function downloadAllIcons() {
      if (Object.keys(canvases).length === 0) {
        alert('Please generate icons first!');
        return;
      }

      const status = document.getElementById('status');
      status.innerHTML = '<p>Downloading icons...</p>';

      sizes.forEach(size => {
        const canvas = canvases[size];
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon-${size}x${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });

      status.innerHTML = '<p style="color:#22c55e;">✓ Icons downloaded! Move them to the /icons/ folder.</p>';
    }

    // Auto-generate on load
    window.addEventListener('load', generateAllIcons);
  </script>
</body>
</html>
